apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: aws-s3-pod-identity
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-aws-s3
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-aws
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-family-aws:{{ .Values.providerVersion }}
  revisionHistoryLimit: 1
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3:{{ .Values.providerVersion }}
  # Family is explicitly installed above, with the same pinned version.
  skipDependencyResolution: true
  revisionHistoryLimit: 1
  runtimeConfigRef:
    name: aws-s3-pod-identity
