[tools]
node = "24.21.0"
pnpm = "12.8.1"

[env]
DATABASE_URL = "postgres://skjera:skjera@localhost:5433/skjera"
OAUTH_ISSUER = "http://localhost:5556/dex"
OAUTH_CLIENT_ID = "skjera-dev"
OAUTH_CLIENT_SECRET = "skjera-dev-secret"
OAUTH_REDIRECT_URI = "http://localhost:5173/auth/callback"
OAUTH_ALLOWED_DOMAINS = "example.com"
OAUTH_ALLOW_INSECURE_REQUESTS = "true"
S3_ENDPOINT = "http://localhost:9000"
S3_REGION = "us-east-1"
S3_BUCKET = "skjera-images"
S3_ACCESS_KEY_ID = "skjera"
S3_SECRET_ACCESS_KEY = "skjera-dev-secret"
# Where the site is, what it's called, and who emails come from.
SITE_URL = "http://localhost:5173"
SITE_NAME = "Skjera"
# The language for those who haven't picked one: en, nb or nn.
SITE_LOCALE = "en"
# The websites that may show /embed in an iframe and read /api/public/events
# from the browser, each address they are served at. Here it stands in for
# them, in development and in the browser test, which serves its own page at
# this address.
WEBSITE_ORIGINS = "http://website.localhost"
# SLACK_BOT_TOKEN and SLACK_CHANNEL are not set here, so nothing is posted to
# Slack in development. The Readme says how to set them.
# HUBSPOT_ACCOUNT_ID is not set either, so nothing is loaded from HubSpot in
# development or the browser tests.
# Branding, all optional. Files in SITE_ASSETS_DIR are served at /site-assets/.
SITE_ASSETS_DIR = "{{config_root}}/dev/site-assets"
SITE_LOGO = "/site-assets/logo.svg"
SITE_LOGO_DARK = "/site-assets/logo-dark.svg"
# A line of text and links (each with an optional logo), as JSON.
SITE_FOOTER = """
{
  "text": "Skjera · Events, together · privacy@skjera.localhost",
  "links": [
    {
      "label": "Example Ltd",
      "href": "https://example.com",
      "logo": { "src": "/site-assets/logo.svg", "darkSrc": "/site-assets/logo-dark.svg" }
    }
  ]
}
"""
# For the privacy page: who answers for the data kept, and how to reach them.
SITE_OPERATOR = "Skjera"
SITE_CONTACT_EMAIL = "privacy@skjera.localhost"
EMAIL_FROM = "Skjera <events@skjera.localhost>"
# Signs what's put in links, e.g. guests' links to their signups.
SIGNING_SECRET = "skjera-dev-signing-secret"
EMAIL_TRANSPORT = "smtp"
EMAIL_SMTP_URL = "smtp://localhost:1025"
# Test servers (pnpm test-server, see the Readme) are reached at
# SKJERA_TEST_SERVER_URL, which belongs to the machine: set it in its own mise
# config, not here. Where it's set, Mailpit's web UI is open to other machines.
MAILPIT_UI_ADDRESS = "{% if env.SKJERA_TEST_SERVER_URL | default(value='') %}0.0.0.0{% else %}127.0.0.1{% endif %}"

[tasks.hooks]
description = "Activate git hooks in .hooks/"
run = "git config core.hooksPath .hooks"

[tasks.setup]
description = "Install dependencies, git hooks and Playwright's browser"
depends = ["hooks"]
run = [
  "pnpm install",
  "pnpm --filter @skjera/oauth exec playwright install chromium",
]
