[tools]
go-jsonnet = "0.22.0"
kubeseal = "0.41.2"
node = "24.21.0"
opentofu = "1.13.1"
oras = "1.3.6"
pnpm = "12.8.1"

[env]
DATABASE_URL = "postgres://skjera:skjera@localhost:5433/skjera"
OAUTH_ISSUER = "http://localhost:5556/dex"
OAUTH_CLIENT_ID = "skjera-dev"
OAUTH_CLIENT_SECRET = "skjera-dev-secret"
OAUTH_REDIRECT_URI = "http://localhost:5173/auth/callback"
OAUTH_ALLOWED_DOMAINS = "example.com"
OAUTH_ALLOW_INSECURE_REQUESTS = "true"
S3_ENDPOINT = "http://localhost:9000"
S3_REGION = "us-east-1"
S3_BUCKET = "skjera-images"
# Local RustFS only; cloud buckets are created and deleted by Crossplane.
S3_CREATE_BUCKET = "true"
S3_ACCESS_KEY_ID = "skjera"
S3_SECRET_ACCESS_KEY = "skjera-dev-secret"
# Where the site is, what it's called, and who emails come from.
SITE_URL = "http://localhost:5173"
SITE_NAME = "Skjera"
# The language for those who haven't picked one: en, nb or nn.
SITE_LOCALE = "en"
# The websites that may show /embed in an iframe and read /api/public/events
# from the browser, each address they are served at. Here it stands in for
# them, in development and in the browser test, which serves its own page at
# this address.
WEBSITE_ORIGINS = "http://website.localhost"
# SLACK_BOT_TOKEN and SLACK_CHANNEL are not set here, so nothing is posted to
# Slack in development. The Readme says how to set them.
# HUBSPOT_ACCOUNT_ID is not set either, so nothing is loaded from HubSpot in
# development or the browser tests. Nor is HUBSPOT_ACCESS_TOKEN, so nothing is
# sent to HubSpot and the studio offers no sales event setting.
# Branding, all optional. Files in SITE_ASSETS_DIR are served at /site-assets/.
SITE_ASSETS_DIR = "{{config_root}}/dev/site-assets"
# The footer, as JSON: a heading, groups of logos (each with a title or none;
# a logo with an "href" is a link), links, and a line of text where {year} is
# the year. Every text is a string, or one per language (nb is required, nn and
# en optional). This is Capra's, as in Skjer; its logos are in
# packages/app/public/footer. The "src" of a logo is for a light background.
SITE_FOOTER = """
{
  "heading": {
    "nb": "Vi er en del av Capra-gruppen",
    "nn": "Vi er ein del av Capra-gruppa",
    "en": "We are part of the Capra Group"
  },
  "groups": [
    {
      "title": { "nb": "Sertifiseringer", "nn": "Sertifiseringar", "en": "Certifications" },
      "logos": [
        {
          "label": { "nb": "Miljøfyrtårn-sertifisering", "en": "Eco-Lighthouse certification" },
          "src": "/footer/miljofyrtarn-dark.webp",
          "darkSrc": "/footer/miljofyrtarn-light.webp"
        },
        {
          "label": { "nb": "DNV-sertifisering", "en": "DNV certification" },
          "src": "/footer/dnv-dark.webp",
          "darkSrc": "/footer/dnv-light.webp"
        }
      ]
    },
    {
      "logos": [
        {
          "label": { "nb": "Capra-logo", "en": "Capra logo" },
          "src": "/footer/capra-black-vertical.webp",
          "darkSrc": "/footer/capra-white-vertical.webp",
          "href": "https://www.capraconsulting.no/"
        },
        {
          "label": { "nb": "Liflig-logo", "en": "Liflig logo" },
          "src": "/footer/liflig-black-vertical.webp",
          "darkSrc": "/footer/liflig-white-vertical.webp",
          "href": "https://www.liflig.no/"
        }
      ]
    }
  ],
  "text": "{year} © Capra | Torggata 2-4, 0180 Oslo | post@capraconsulting.no"
}
"""
# What search engines and shared links are told: the site's description, and
# the Twitter handle, author and publisher of an event's page.
SITE_DESCRIPTION = "Skjer | Capra Liflig"
SITE_TWITTER = "@capraconsulting"
SITE_AUTHOR = "Capra Consulting"
SITE_PUBLISHER = "Capra Consulting"
# For the privacy page: who answers for the data kept, and how to reach them.
SITE_OPERATOR = "Skjera"
SITE_OPERATOR_ORG_NUMBER = "123 456 789"
SITE_OPERATOR_ADDRESS = "Storgata 1, 0150 Oslo"
SITE_CONTACT_EMAIL = "privacy@skjera.localhost"
EMAIL_FROM = "Skjera <events@skjera.localhost>"
# Signs what's put in links, e.g. guests' links to their signups.
SIGNING_SECRET = "skjera-dev-signing-secret"
EMAIL_TRANSPORT = "smtp"
EMAIL_SMTP_URL = "smtp://localhost:1025"
# Test servers (pnpm test-server, see the Readme) are reached at
# SKJERA_TEST_SERVER_URL, which belongs to the machine: set it in its own mise
# config, not here. Where it's an http:// address, Dex and Mailpit's web UI are
# open to other machines; with https:// the TLS proxy holds ports 5556 and 8025
# on the machine's other addresses, so both listen on 127.0.0.1 behind it.
SERVICES_ADDRESS = "{% if env.SKJERA_TEST_SERVER_URL | default(value='') | truncate(length=7, end='') == 'http://' %}0.0.0.0{% else %}127.0.0.1{% endif %}"

[tasks.hooks]
description = "Activate git hooks in .hooks/"
run = "git config core.hooksPath .hooks"

[tasks.testdata]
description = "Fill the local database with the teams and events docs/acceptance describes"
dir = "{{config_root}}/packages/server"
run = "node --import tsx testdata.ts fill"

[tasks."testdata:clear"]
description = "Remove the teams and events of docs/acceptance from the local database"
dir = "{{config_root}}/packages/server"
run = "node --import tsx testdata.ts clear"
[tasks.argocd]
description = "Access Argo CD at https://localhost:8080 (requires AWS login)"
run = [
  "aws eks update-kubeconfig --region eu-north-1 --name skjera-dev --alias skjera-dev",
  "mise exec kubectl@1.35 -- kubectl --context skjera-dev -n argocd port-forward svc/argocd-server 8080:443 --address 127.0.0.1",
]

[tasks."preview:render"]
description = "Render the bucket and PostgreSQL resources for a PR"
usage = 'arg "<pr>" help="Pull request number"'
run = 'jsonnet --tla-str prNumber="$usage_pr" deploy/preview/main.jsonnet'

[tasks.setup]
description = "Install dependencies, git hooks and Playwright's browser"
depends = ["hooks"]
run = [
  "pnpm install",
  "pnpm --filter @skjera/oauth exec playwright install chromium",
]

[tasks."preview:smoke"]
description = "Publish, verify and clean up one disposable Argo CD preview (AWS login required)"
run = "node deploy/preview/smoke.ts"

[tasks."preview:prepare"]
description = "Prepare the local skjera-deploy checkout without pushing"
usage = 'arg "[directory]" default="../skjera-deploy" help="Local deployment repository checkout"'
run = 'node deploy/automation/prepare.ts "$usage_directory"'

[tasks."preview:certificate"]
description = "Export the cluster public sealing certificate to skjera-deploy (AWS login required)"
usage = 'arg "[directory]" default="../skjera-deploy" help="Local deployment repository checkout"'
run = 'node deploy/automation/prepare.ts "$usage_directory" --certificate'

[tasks."preview:test"]
description = "Check preview manifests and PR reconciliation without AWS access"
run = ["pnpm --filter @skjera/deploy test:infra", "pnpm --filter @skjera/deploy test"]
