# Checks every push to main and every pull request: lint, types and tests
# against the local services, the end-to-end tests, and that the image
# builds, starts and serves. As locally: tools from mise (mise.toml),
# services from compose.yml, both pinned; actions pinned by commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request supersedes a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: pnpm's store, by lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: mise exec -- pnpm install --frozen-lockfile
      # Every service the tests use is started here: packages whose tests
      # started the same one at once would race for its container's name.
      - name: Services
        run: docker compose up --detach --wait postgres rustfs mailpit
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm typecheck
      - run: mise exec -- pnpm test

  # The site's browser tests, split by file across four machines that run at
  # once: on one, a test at a time, they took about 20 minutes.
  e2e:
    name: End-to-end tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Each part reports its own failures; one failing stops none of the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: pnpm's store, by lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: Playwright's browser, by Playwright's version
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Chromium, and what it needs from the system
        run: mise exec -- pnpm --filter @skjera/oauth exec playwright install --with-deps chromium
      - name: Services
        run: docker compose up --detach --wait postgres dex rustfs mailpit
      # The tests start the server and the app themselves (see
      # playwright.config.ts); CI=true makes them retry and report here.
      # The login's own few tests run once, in the first part.
      - if: matrix.shard == 1
        run: mise exec -- pnpm --filter @skjera/oauth test:e2e
      - run: mise exec -- pnpm --filter @skjera/app test:e2e --shard=${{ matrix.shard }}/4
      - name: The report and traces, when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            packages/*/playwright-report/
            packages/*/test-results/
          retention-days: 14

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Loaded into the runner's Docker, to be started below.
      # Check builds without AWS access, including for fork pull requests.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: skjera
          cache-from: type=gha,scope=skjera-app
          cache-to: type=gha,scope=skjera-app,mode=max
      # A new runner has no volume: the database starts empty. Compose's
      # healthcheck asks over the socket, which answers while Postgres is
      # still setting up; the server connects over TCP.
      - name: Services
        run: |
          docker compose up --detach --wait postgres rustfs
          timeout 30 sh -c 'until docker compose exec -T postgres pg_isready -h 127.0.0.1 -U skjera -d skjera; do sleep 1; done'
      # What the server needs to start; PORT and STATIC_DIR are the image's
      # own. The login's endpoints are given, so it starts without Dex.
      - name: Start the image
        id: start
        run: >-
          docker run --detach --name skjera --network host
          --env DATABASE_URL=postgres://skjera:skjera@localhost:5433/skjera
          --env OAUTH_ISSUER=http://localhost:5556/dex
          --env OAUTH_CLIENT_ID=skjera-dev
          --env OAUTH_CLIENT_SECRET=skjera-dev-secret
          --env OAUTH_REDIRECT_URI=http://localhost:3000/auth/callback
          --env OAUTH_AUTHORIZATION_ENDPOINT=http://localhost:5556/dex/auth
          --env OAUTH_TOKEN_ENDPOINT=http://localhost:5556/dex/token
          --env S3_ENDPOINT=http://localhost:9000
          --env S3_BUCKET=skjera-images
          --env S3_CREATE_BUCKET=true
          --env S3_ACCESS_KEY_ID=skjera
          --env S3_SECRET_ACCESS_KEY=skjera-dev-secret
          --env SIGNING_SECRET=skjera-ci-signing-secret
          skjera
      # The port answers only once the migrations have run
      # (packages/server/src/main.ts).
      - name: Ready on port 3000
        run: |
          deadline=$((SECONDS + 60))
          until [ "$(curl --silent --max-time 2 http://localhost:3000/health/ready)" = ok ]; do
            if [ "$(docker inspect --format '{{.State.Running}}' skjera)" != true ]; then
              echo "::error::The container stopped before it was ready"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Not ready on port 3000 within 60 seconds"
              exit 1
            fi
            sleep 1
          done
      # The built page loads its script from /assets/; the source page doesn't.
      - name: The built app on port 3000
        run: |
          page=$(curl --fail --silent --show-error http://localhost:3000/)
          script=$(printf '%s' "$page" | grep --only-matching 'src="/assets/[^"]*\.js"' | head -n 1 | cut -d '"' -f 2 || true)
          [ -n "$script" ] || { echo "::error::The front page is not the built app"; exit 1; }
          curl --fail --silent --show-error --output /dev/null "http://localhost:3000$script"
      - name: The container's log, when a check failed
        if: failure() && steps.start.outcome == 'success'
        run: docker logs skjera

  preview-infra:
    name: Preview infrastructure and automation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go-jsonnet kubeseal opentofu
      - name: Bcrypt tool for secret encryption tests
        run: |
          if ! command -v htpasswd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes apache2-utils
          fi
      - run: mise run preview:test
      - run: mise exec shellcheck@0.11.0 actionlint@1.7.12 -- actionlint
      - run: mise exec helm@4.3.0 -- helm lint infra/argocd/charts/previews
      - name: Check OpenTofu without cloud credentials
        run: |
          mise exec -- tofu fmt -check -recursive infra
          mise exec -- tofu -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
          mise exec -- tofu -chdir=infra/bootstrap test
          mise exec -- tofu -chdir=infra/common init -backend=false -input=false -lockfile=readonly
          mise exec -- tofu -chdir=infra/common test

  publish:
    name: Publish image to ECR
    needs: [checks, e2e, image, preview-infra]
    # Fork and Dependabot PRs remain build-only. Never use pull_request_target
    # to run PR code with publishing credentials.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: skjera-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::440027025698:role/skjera-dev-github-ecr
          aws-region: eu-north-1
          allowed-account-ids: '440027025698'
          role-session-name: github-ecr-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Authenticate Docker to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and publish the checked revision
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Include the run/attempt so reruns work with immutable ECR tags.
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=skjera-app
          cache-to: type=gha,scope=skjera-app,mode=max
      - name: Record immutable image reference
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published image: %s/%s@%s\n' "$REGISTRY" "$ECR_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      # The privileged deployment workflow runs trusted code from main. This
      # artifact is data only, validated against the run and the current PR.
      - name: Record PR image for deployment
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.publish.outputs.digest }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("preview-image.json").write_text(json.dumps({
              "prNumber": os.environ["PR_NUMBER"], "image": os.environ["IMAGE"],
              "headSha": os.environ["HEAD_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }))
          PY
      - name: Upload PR image metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-image
          path: preview-image.json
          retention-days: 7
