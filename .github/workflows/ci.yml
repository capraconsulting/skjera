# Checks every push to main and every pull request: lint, types and tests
# against the local services, the end-to-end tests, and that the image
# builds. As locally: tools from mise (mise.toml), services from
# compose.yml, both pinned; actions pinned by commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request supersedes a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: pnpm's store, by lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: Services
        run: docker compose up --detach --wait postgres mailpit
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm typecheck
      - run: mise exec -- pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: pnpm's store, by lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: Playwright's browser, by Playwright's version
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Chromium, and what it needs from the system
        run: mise exec -- pnpm --filter @skjera/oauth exec playwright install --with-deps chromium
      - name: Services
        run: docker compose up --detach --wait postgres dex rustfs mailpit
      # The tests start the server and the app themselves (see
      # playwright.config.ts); CI=true makes them retry and report here.
      - run: mise exec -- pnpm test:e2e
      - name: The report and traces, when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/*/playwright-report/
            packages/*/test-results/
          retention-days: 14

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built, not pushed: publishing is for when there is somewhere to.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
