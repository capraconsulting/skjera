# Local development processes. Start with `pnpm dev`.
procs:
  postgres:
    cmd: ["docker", "compose", "up", "postgres"]
    # Detach instead of stopping the container.
    stop:
      send-keys: ["<d>"]
  dex:
    cmd: ["docker", "compose", "up", "dex"]
    stop:
      send-keys: ["<d>"]
  rustfs:
    cmd: ["docker", "compose", "up", "rustfs"]
    stop:
      send-keys: ["<d>"]
  mailpit:
    cmd: ["docker", "compose", "up", "mailpit"]
    stop:
      send-keys: ["<d>"]
  # Recompiles the messages (packages/i18n) as they change.
  i18n:
    cmd: ["pnpm", "--filter", "@skjera/i18n", "dev"]
  server:
    cmd: ["pnpm", "--filter", "@skjera/server", "dev"]
  app:
    cmd: ["pnpm", "--filter", "@skjera/app", "dev"]
