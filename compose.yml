services:
  postgres:
    # Postgres 18 with pg_automerge (https://github.com/TheKnarf/pg-automerge),
    # its released image. Images are pinned by digest: the same everywhere.
    image: ghcr.io/theknarf/pg-automerge:0.1.0@sha256:75f077d3ddfbcc1b6e34753785cebd346566996652cf0381d444e72a0864f96c
    environment:
      POSTGRES_USER: skjera
      POSTGRES_PASSWORD: skjera
      POSTGRES_DB: skjera
    command:
      - postgres
      - -c
      - default_toast_compression=lz4
      - -c
      - pg_automerge.max_load_memory=1GB
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skjera", "-d", "skjera"]
      interval: 2s
      timeout: 2s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5558/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # S3-compatible object storage for uploaded images.
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: skjera
      RUSTFS_SECRET_KEY: skjera-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      # The web console.
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Catches every email sent in development; read them at
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres:
  rustfs:
